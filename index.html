<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>驾驭AI编程</title>
  <meta name="description" content="写给已经会写代码，但还没系统用过 AI 编程工具的程序员。" />
  <!-- Docsify 主题 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" />
</head>
<body>
  <div id="app">加载中...</div>

  <script>
    window.$docsify = {
      name: '驾驭AI编程',
      repo: 'jiangqingsong/master_ai_programming',
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        placeholder: '搜索',
        noData: '没有找到结果',
        depth: 6
      },
      auto2top: true,
      coverpage: false,
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    };
  </script>

  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    // 初始化 mermaid
    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    // 每次页面内容更新后渲染 mermaid 图表
    var observer = new MutationObserver(function () {
      var els = document.querySelectorAll('.mermaid');
      els.forEach(function (el) {
        if (el.getAttribute('data-processed')) return;
        try {
          mermaid.run({ nodes: [el] });
        } catch (e) {
          console.error('Mermaid render error:', e);
        }
      });
    });
    observer.observe(document.getElementById('app'), { childList: true, subtree: true });
  </script>

  <!-- Docsify 核心 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- 搜索插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- 暗黑模式 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <!-- 代码高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
</body>
</html>
